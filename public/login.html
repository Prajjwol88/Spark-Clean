<!DOCTYPE html>
<!-- Presentation layer: Stock Manager login page (SparkClean Ltd - Stock Management, Bibek) -->
<!-- Only the owner of the Stock component can log in; the password is checked on the server (clsStaffLogin) -->
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Stock Manager login - SparkClean Ltd</title></head>
<body>
<header><div class="brand">Spark<span>Clean</span> Ltd</div><nav><a href="shop.html">Shop</a></nav></header>
<main>
  <div class="card narrow">
    <h1>Stock Manager login</h1>
    <p class="muted">This page is for the Stock Manager only. Other staff log in to their own pages.</p>
    <div class="error" id="error" hidden></div>
    <!-- login form: login.js sends the username and password to /api/login -->
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <p><button class="btn" type="submit">Log in</button></p>
    </form>
  </div>
</main>
<!-- shared helpers, then the script for this page -->
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
