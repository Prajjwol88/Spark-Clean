<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Stock Manager login - SparkClean Ltd</title></head>
<body>
<header class="shop-header">
  <div class="brand">Spark Clean Ltd</div>
  <nav>
    <a class="shop-link" href="shop.html">Shop</a>
    <a class="manager-login" href="login.html">Manager Login</a>
  </nav>
</header>
<main class="login-layout">
  <section class="shop-hero">
  <h2>Cleaning supplies</h2>
  <a class="main-shop-browse" href="shop.html">Browse shop</a>
</section>
  <div class="card narrow">
    <h1>Manager login</h1>
    <p class="muted">This page is for the Managers.</p>
    <div class="error" id="error" hidden></div>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <p><button class="btn" type="submit">Log in</button></p>
    </form>
  </div>
</main>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
