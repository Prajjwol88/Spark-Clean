<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Stock Manager login - SparkClean Ltd</title></head>
<body>
<header><div class="brand">Spark<span>Clean</span> Ltd</div><nav><a href="shop.html">Shop</a></nav></header>
<main>
  <div class="card narrow">
    <h1>Stock Manager login</h1>
    <p class="muted">This page is for the Stock Manager only. Other staff log in to their own pages.</p>
    <div class="error" id="error" hidden></div>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <p><button class="btn" type="submit">Log in</button></p>
    </form>
  </div>
</main>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
