<!DOCTYPE html>
<!-- Presentation layer: stock change log page (Sprint 5, staff only) -->
<!-- lists every add, edit and delete from tblStockLog, newest first -->
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Change log - SparkClean Ltd</title></head>
<body>
<!-- page header: company name, navigation links and log out -->
<header><div class="brand">Spark<span>Clean</span> Ltd</div><nav><a href="menu.html">Main menu</a><a href="stock.html">Stock</a><a href="stock-log.html">Change log</a><a href="shop.html">Shop</a><a href="#" id="logout">Log out</a></nav></header>
<main>
  <h1>Stock change log <span class="muted" id="count"></span></h1>
  <p class="muted">Every product added, edited or deleted by the Stock Manager, newest first.</p>
  <!-- message box: shown when nothing has been recorded yet -->
  <div class="message" id="message" hidden></div>
  <!-- log table: rows are added by stock-log.js from /api/stocklog -->
  <table>
    <thead>
      <tr><th>Log no.</th><th>Date and time</th><th>Action</th><th>Product no.</th><th>Product name</th><th>Changed by</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<!-- shared helpers, then the script for this page -->
<script src="js/common.js"></script>
<script src="js/stock-log.js"></script>
</body>
</html>
